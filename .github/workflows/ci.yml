# Checks every push and pull request: Dart analysis + tests, and the native
# bridge compiled with warnings as errors, then run headless against a real
# libretro core and a Game Boy CPU test ROM.
name: CI

on:
  push:
    branches: [main, "release-test/**"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  flutter:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Plugin
        working-directory: packages/romrunner_core
        run: |
          flutter pub get
          flutter analyze

  bridge:
    name: Native bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile (with audio, warnings as errors)
        run: |
          cc -O2 -Wall -Wextra -Wno-unused-parameter -Werror \
             -Wno-error=format-truncation \
             -c packages/romrunner_core/src/romrunner_core.c -o /tmp/bridge.o
      - name: Headless run against Gambatte + cpu_instrs
        run: |
          DEST=/tmp/cores CORES=gambatte tool/fetch_cores.sh linux
          git clone --depth 1 -q https://github.com/retrio/gb-test-roms.git /tmp/gbroms
          cd /tmp
          "$GITHUB_WORKSPACE/tool/test_bridge.sh" /tmp/cores/gambatte_libretro.so \
            /tmp/gbroms/cpu_instrs/cpu_instrs.gb 3600 | tee out.txt
          grep -q "frames produced" out.txt

  n64:
    name: N64 core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (warnings as errors)
        working-directory: cores/n64
        run: make -j4
      - name: CPU and system tests
        working-directory: cores/n64
        run: make test
      - name: Through the app's bridge
        if: runner.os == 'Linux'
        working-directory: cores/n64/build
        run: |
          ./system_test --write-rom test.z64
          "$GITHUB_WORKSPACE/tool/test_bridge.sh" "$PWD/romrunner_n64_libretro.so" "$PWD/test.z64" 120 | tee out.txt
          grep -q "last 320x237" out.txt
          grep -q "non-black pixels: 75840 of 75840" out.txt

  n64-suites:
    name: N64 test cartridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the core and test tools
        working-directory: cores/n64
        run: make -j4 && make tools
      - name: Fetch krom's test ROMs (public domain)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/PeterLemon/N64 /tmp/krom
          git -C /tmp/krom sparse-checkout set CPUTest RSPTest
      - name: Build Dillon's n64-tests
        continue-on-error: true
        run: |
          git clone -q https://github.com/ARM9/bass /tmp/bass
          git -C /tmp/bass checkout -q v14
          make -C /tmp/bass/bass -j4
          mkdir -p /tmp/tools "$HOME/.local/share/bass"
          cp /tmp/bass/bass/bass /tmp/tools/ 2>/dev/null || cp /tmp/bass/bass/out/bass /tmp/tools/
          cp -r /tmp/bass/bass/data/architectures "$HOME/.local/share/bass/" 2>/dev/null || true
          cp cores/n64/build/chksum64 /tmp/tools/
          export PATH="/tmp/tools:$PATH"
          git clone -q --depth 1 https://github.com/Dillonb/n64-tests /tmp/dillon
          cmake -S /tmp/dillon -B /tmp/dillon/build -DCMAKE_BUILD_TYPE=Release
          make -C /tmp/dillon/build -j4
          find /tmp/dillon/build/src -name '*.z64' | wc -l
      - name: Run all and compare with the baseline
        run: |
          pip install --quiet pillow
          DILLON=()
          if ls /tmp/dillon/build/src/*.z64 >/dev/null 2>&1; then DILLON=(--dillon /tmp/dillon/build/src); fi
          python3 cores/n64/test/suites.py --romtest cores/n64/build/romtest --krom /tmp/krom "${DILLON[@]}" \
            --baseline cores/n64/test/suite_baseline.txt --summary "$GITHUB_STEP_SUMMARY" | tee /tmp/suite.md
          echo "::notice title=N64 suites::$(head -1 /tmp/suite.md | sed 's/## //')"
          grep -o "dillon/[^ |]* | [A-Z]*" /tmp/suite.md | sed 's/^/::notice title=dillon::/' | head -40 || true

  downloads:
    name: Download ${{ matrix.emulator }}
    # Checks that every emulator's official download still resolves, so the
    # in-app installer keeps working. Informational: upstream sites change.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emulator: [pcsx2, rpcs3, xemu, xenia, cemu, azahar, simple64, rmg, vita3k, ppsspp, eden, ryujinx, armsx2]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve all sources
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter pub get
          dart run tool/check_downloads.dart --github ${{ matrix.emulator }}
